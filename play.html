<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>스트리밍 원클릭</title>
<style>
:root{--bg:#0a1220;--card:#0f1a2b;--line:#22324a;--fg:#f3f6fb;--muted:#9fb0c8;--gold:#f2c94c;--M:#7ee08a;--G:#c9a7ff;--B:#ff9a8a;--N:#8fb4ff;--F:#7fd6c8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#14233a 0%,var(--bg) 60%);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:520px;margin:0 auto;padding:44px 18px 60px}
.card{background:rgba(15,26,43,.92);border:1px solid var(--line);border-radius:26px;padding:34px 22px 30px}
h1{text-align:center;font-size:clamp(26px,7vw,34px);font-weight:600;letter-spacing:-.5px;margin:0 0 26px;overflow-wrap:anywhere}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0b1424;border-radius:16px;padding:7px}
.tabs button{font:inherit;font-size:15px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:12px;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--gold);background:#1a2840;border-color:#4a4a3a}
.tabs button:focus-visible,.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rows{margin-top:18px}
.row{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.ic{width:46px;height:46px;flex:none;border-radius:13px;border:1px solid var(--line);background:#0c1626;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.nm{flex:1;font-weight:700;font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.go{display:inline-flex;align-items:center;gap:9px;min-height:52px;padding:0 16px;border-radius:13px;border:1px solid #2c3f5c;background:#0f1d33;color:var(--fg);text-decoration:none;font-weight:700;font-size:15px}
.go::after{content:'↗';font-size:17px;opacity:.9}
.go:active{filter:brightness(1.3)}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}
.err{text-align:center;color:var(--muted);padding:30px 0}
.M{color:var(--M)}.G{color:var(--G)}.B{color:var(--B)}.N{color:var(--N)}.F{color:var(--F)}
</style>
</head>
<body>
<main>
 <div class="card">
  <h1 id="title">스트리밍</h1>
  <div class="tabs" role="group" aria-label="기기 선택">
   <button type="button" data-d="android"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.2"/><path d="M11.5 18h1"/></svg>Android</button>
   <button type="button" data-d="ios"><svg viewBox="0 0 24 24"><rect x="8" y="2.5" width="11" height="19" rx="2.2"/><rect x="4.5" y="9" width="6" height="11" rx="1.6"/></svg>iPhone</button>
   <button type="button" data-d="pc"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.8"/><path d="M12 16v4M8 20h8"/></svg>PC</button>
  </div>
  <div class="rows" id="rows"></div>
  <p class="note" id="note"></p>
 </div>
</main>
<script>
'use strict';
const q=new URLSearchParams(location.search);
const P=[['melon','m','M','멜론'],['genie','g','G','지니'],['bugs','b','B','벅스'],['vibe','n','V','바이브'],['flo','f','F','플로']];
const CLS={melon:'M',genie:'G',bugs:'B',vibe:'N',flo:'F'};
const ids={};P.forEach(([p,k])=>{ids[p]=(q.get(k)||'').split(',').filter(x=>/^\d{1,15}$/.test(x));});
const title=(q.get('t')||'').trim().slice(0,60)||'스트리밍';
document.getElementById('title').textContent=title;document.title=title+' 원클릭';
let device=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'ios':/Android/i.test(navigator.userAgent)?'android':'pc';

function link(p,list){if(!list.length)return null;const c=list.join(',');
 if(p==='melon')return device==='ios'?`meloniphone://play/?ctype=1&menuid=0&cid=${c}`:device==='pc'?`melonapp://play?cType=1&menuId=1000002721&cList=${c}`:`melonapp://play?ctype=1&menuid=1000002721&cid=${c}`;
 if(p==='genie')return device==='ios'?`ktolleh00167://landing/?landing_type=31&landing_target=${list.join(';')}`:device==='pc'?`https://www.genie.co.kr/player/shareProcessV2?xgnm=${list.join(';')}`:`cromegenie://scan/?landing_type=31&landing_target=${list.join(';')}`;
 if(p==='bugs')return device==='pc'?`https://music.bugs.co.kr/newPlayer?trackId=${c}`:`bugs3://app/tracks/lists?title=${encodeURIComponent('전체듣기')}&miniplay=Y&track_ids=${list.join('|')}`;
 if(p==='vibe')return device==='pc'?null:`vibe://listen?version=3&trackIds=${c}`;
 if(p==='flo')return device==='pc'?null:`flomusic://play/public?type=track&ids=${c}`;
 return null;}
/* 생성기와 같은 규칙: 멜론(아이폰 제외)·바이브는 같은 곡이 다시 나오기 직전에서 나눔 */
function chunks(list){const out=[];let cur=[];for(const id of list){if(cur.includes(id)){out.push(cur);cur=[];}cur.push(id);}if(cur.length)out.push(cur);return out;}
function render(){
 document.querySelectorAll('[data-d]').forEach(b=>{const on=b.dataset.d===device;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
 const box=document.getElementById('rows');box.replaceChildren();let multi=false;
 for(const [p,,letter,name] of P){const list=ids[p];if(!list.length)continue;
  const split=(p==='vibe')||(p==='melon'&&device!=='ios');
  const urls=(split?chunks(list):[list]).map(x=>link(p,x)).filter(Boolean);if(!urls.length)continue;
  const row=document.createElement('div');row.className='row';
  const ic=document.createElement('span');ic.className='ic '+CLS[p];ic.textContent=letter;
  const nm=document.createElement('span');nm.className='nm';nm.textContent=name;
  const btns=document.createElement('div');btns.className='btns';
  if(urls.length>1)multi=true;
  urls.forEach((u,i)=>{const a=document.createElement('a');a.className='go';a.href=u;a.textContent=urls.length>1?(i+1)+'번':'열기';
   a.setAttribute('aria-label',name+' '+(urls.length>1?(i+1)+'번 링크':'')+' 열기');if(u.startsWith('http')){a.target='_blank';a.rel='noopener';}btns.append(a);});
  row.append(ic,nm,btns);box.append(row);}
 if(!box.childElementCount){const e=document.createElement('div');e.className='err';e.textContent='담긴 곡이 없거나 이 기기용 링크가 없습니다.';box.append(e);}
 document.getElementById('note').textContent=multi?'여러 버튼은 1번부터 순서대로 눌러주세요':'';}
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{device=b.dataset.d;render();}));
render();
</script>
</body>
</html>
